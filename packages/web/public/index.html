<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskman Operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="nav" aria-label="Primary">
    <div class="brand">
      <div class="mark" aria-hidden="true">TM</div>
      <div>
        <div class="brand-name">TASKMAN</div>
        <div class="brand-sub">OPERATOR</div>
      </div>
    </div>
    <a class="nav-link" href="#/overview">Overview</a>
    <a class="nav-link" href="#/ledger">Ledger</a>
    <a class="nav-link" href="#/autonomy">Autonomy</a>
    <a class="nav-link" href="#/work">Work</a>
    <a class="nav-link" href="#/growth">Growth</a>
    <p class="nav-foot">Settlement-verified numbers only. Estimates stay labeled.</p>
  </aside>
  <header class="top">
    <div>
      <h1 id="page-title">Overview</h1>
      <nav class="mobile-nav" aria-label="Screens">
        <a href="#/overview">Overview</a>
        <a href="#/ledger">Ledger</a>
        <a href="#/autonomy">Autonomy</a>
        <a href="#/work">Work</a>
        <a href="#/growth">Growth</a>
      </nav>
    </div>
    <div class="controls">
      <input type="text" id="api-base" placeholder="API base URL" aria-label="API base URL">
      <input type="password" id="api-token" placeholder="Bearer token (optional)" aria-label="API token">
      <label class="proxy-toggle"><input type="checkbox" id="use-proxy" checked> proxy</label>
      <button id="save" type="button">Connect</button>
      <button id="refresh" class="primary" type="button">Refresh</button>
    </div>
  </header>
  <main class="main">
    <div id="error" class="err" hidden role="alert"></div>
    <div id="view" aria-live="polite"></div>
    <p class="foot" id="foot">Set the API base and press Connect. This page stores no ledger of its own.</p>
  </main>
</div>
<script src="app.js"></script>
<script src="screens.js"></script>
</body>
</html>
