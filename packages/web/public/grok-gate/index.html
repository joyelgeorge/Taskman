<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#030303" media="(prefers-color-scheme: dark)">
<title>Continue with Grok</title>
<link rel="icon" type="image/svg+xml" href="https://grok.com/images/favicon.svg">
<link rel="icon" type="image/x-icon" href="https://grok.com/images/favicon.ico">
<style>
  /* Gate pages — one shared sheet, duplicated into each standalone template.
     Tokens mirror frontend/apps/grok-web/src/app/globals.css. */
  :root {
    --surface-base: #ffffff;      /* --white */
    --fg-primary: #030303;        /* --neutral-1000 */
    --fg-secondary: #636363;      /* --neutral-500 */
    --fg-tertiary: #858585;       /* --neutral-400 */
    --fg-accent: #0890ff;         /* --wd-accent */
    --button-strong: #2c2c2b;
    --button-strong-hover: #3f3f3d;
    --button-strong-fg: #ffffff;
    --button-tint: rgba(59, 20, 0, 0.05);
    --button-tint-hover: rgba(59, 20, 0, 0.09);
    --button-tint-fg: #383836;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-base: #030303;    /* --neutral-1000 */
      --fg-primary: #ffffff;
      --fg-secondary: #9e9e9e;    /* --neutral-300 */
      --fg-tertiary: #858585;     /* --neutral-400 */
      --fg-accent: #299fff;       /* --wd-accent, dark scope */
      /* The filled button inverts on dark, per the warm pair in globals.css. */
      --button-strong: #f5f3f2;
      --button-strong-hover: #ffffff;
      --button-strong-fg: #0f0d0a;
      --button-tint: rgba(255, 255, 255, 0.08);
      --button-tint-hover: rgba(255, 255, 255, 0.12);
      --button-tint-fg: #f5f3f2;
    }
  }
  @font-face {
    font-family: "Universal Sans";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url("https://cdn.grok.com/_next/static/media/UniversalSans_Text_400.p.06he22w9ae9uz.woff2") format("woff2");
  }
  @font-face {
    font-family: "Universal Sans";
    font-style: normal;
    font-weight: 550;
    font-display: swap;
    src: url("https://cdn.grok.com/_next/static/media/UniversalSans_Text_550.p.0v0vvoupxwn1c.woff2") format("woff2");
  }
  html, body { margin: 0; background: var(--surface-base); }
  /* Column layout: the panel takes the free space and the footer always flows
     after it. Pinning the footer with position:fixed put it under mobile
     browser toolbars, and dropped it off short/landscape viewports entirely. */
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--fg-primary);
    font-family: "Universal Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    box-sizing: border-box;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 36px;
    width: 378px;
    max-width: 100%;
  }
  .head {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }
  /* 64px box from the design; the mark is anchored inside it and overhangs right. */
  .mark { position: relative; height: 64px; width: 100%; }
  .mark svg {
    position: absolute;
    top: 10.61px;
    left: 7.37px;
    width: 88.69px;
    height: 33.89px;
    display: block;
    color: var(--fg-primary);
  }
  .text {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .title {
    margin: 0;
    font-size: 24px;
    font-weight: 550;
    line-height: 1.35;
    letter-spacing: -0.48px;
    color: var(--fg-primary);
    overflow-wrap: anywhere;
  }
  .title .host { color: var(--fg-accent); }
  .copy {
    margin: 0;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.2px;
    color: var(--fg-secondary);
    overflow-wrap: anywhere;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 11px;
    width: 100%;
  }
  .button {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 36px;
    padding: 0 12px;
    border-radius: 12px;
    background: var(--button-strong);
    color: var(--button-strong-fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Universal Sans", system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    line-height: 22px;
    letter-spacing: -0.154px;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .button:hover { background: var(--button-strong-hover); }
  .button:active { opacity: 0.9; }
  .button.tint { background: var(--button-tint); color: var(--button-tint-fg); }
  .button.tint:hover { background: var(--button-tint-hover); }
  .button:focus-visible,
  .footer a:focus-visible {
    outline: 2px solid var(--fg-accent);
    outline-offset: 2px;
  }
  .footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 0 24px 24px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    font-size: 14px;
    line-height: 1.3;
    letter-spacing: -0.2px;
  }
  .footer a { color: var(--fg-secondary); text-decoration: none; }
  .footer a:hover { color: var(--fg-primary); }
  .footer .sep { color: var(--fg-tertiary); }
</style>
</head>
<body>
<main class="wrap">
  <div class="panel">
    <div class="head">
      <div class="mark">
        <svg viewBox="0 0 88.6915 33.888" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="currentColor" d="M88.6915 0.0310506C78.4587 0.865365 38.2379 5.85171 10.3492 33.8879H0L1.15634 32.7354C6.99249 27.0972 32.8169 3.20137 88.6915 0V0.0310506Z"/>
          <path fill="currentColor" d="M53.665 33.8879H45.5536L29.5715 22.2542C31.0442 21.328 32.5265 20.4458 34.0133 19.6057L53.665 33.8879Z"/>
          <path fill="currentColor" d="M40.7015 33.888H32.5937L30.1341 32.0991H16.4022C17.3689 31.2406 18.3476 30.4072 19.3366 29.5983H26.6922L22.8858 26.8294C24.2464 25.817 25.6219 24.8473 27.0086 23.9184L40.7015 33.888Z"/>
          <path fill="currentColor" d="M11.191 12.4364L17.4432 16.98C15.8871 17.8963 14.4308 18.8033 13.0714 19.6904L3.09014 12.4324L11.191 12.4364Z"/>
        </svg>
      </div>
      <div class="text">
        <h1 class="title">Continue with Grok<br><span class="host">mmm.grok.me</span></h1>
        <p class="copy">Sign in to securely access this app.</p>
      </div>
    </div>
    <div class="actions">
      <a class="button" href="https://gate.grok.me/__gate/signin?return_to=https%3A%2F%2Fmmm.grok.me%2F">Login to Continue</a>
      <a class="button tint" href="https://gate.grok.me/__gate/signin?return_to=https%3A%2F%2Fmmm.grok.me%2F">Sign up</a>
    </div>
  </div>
</main>
<footer class="footer">
  <a href="https://x.ai" target="_blank" rel="noopener noreferrer">SpacexAI</a>
  <span class="sep">|</span>
  <a href="https://x.ai/legal/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
</footer>
</body>
</html>
