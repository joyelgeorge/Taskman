# Scores new signals and promotes what passes into the candidate queue.
name: cron · signal-process

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-signal-process
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_cron.yml
    with:
      name: signal-process
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
