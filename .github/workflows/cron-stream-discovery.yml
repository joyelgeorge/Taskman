# Proposes new income streams from recorded evidence — never from a model.
name: cron · stream-discovery

on:
  # PAUSED — schedule disabled, manual dispatch retained.
  # Stream discovery, paused 2026-09-11. Discovering an eighth income stream does not
  # help while four of the existing seven are blocked on a human step and none is
  # blocked on a missing stream. workflow_dispatch is kept. Re-enable when the live
  # lane has cleared a settlement and the constraint moves back to finding more work.
  # schedule:
  #   - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even if this slot already ran (manual runs only).
        type: boolean
        default: true

concurrency:
  group: cron-stream-discovery
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_cron.yml
    with:
      name: stream-discovery
      # Only ever true for a manual dispatch; a scheduled run leaves it false so
      # slot idempotency still governs bursts of deliveries.
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
