name: test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      - run: npm test

  postgresql-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskman
          POSTGRES_PASSWORD: taskman
          POSTGRES_DB: taskman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskman -d taskman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://taskman:taskman@localhost:5432/taskman_test
      PGSSL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      # migrate:all, not migrate — the legacy runner reads db/migrations/ only,
      # so it applies 8 of 14 and the suite then fails on relation "drones"
      # does not exist. packages/db/migrate.js collects both directories.
      - name: Apply every migration from an empty database
        run: npm run migrate:all
      - name: Run the complete PostgreSQL suite serially
        run: npm test -- test/*.test.js --test-concurrency=1
