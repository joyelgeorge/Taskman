# Researches the systems own evidence and files improvement proposals.
name: cron · improve

on:
  # PAUSED — schedule disabled, manual dispatch retained.
  # Self-improvement, paused 2026-09-11. Seven income streams exist: two disproven,
  # four blocked on a human, one live and waiting for a recipient. Generating more
  # capability into a backlog blocked on a person is the failure this project already
  # diagnosed once — supply built without demand — running on a timer. workflow_dispatch
  # is kept, so it still runs on request. Re-enable when something is genuinely blocked
  # on capability rather than on someone sending a message.
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run even if this slot already ran (manual runs only).
        type: boolean
        default: true

concurrency:
  group: cron-improve
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_cron.yml
    with:
      name: improve
      # Only ever true for a manual dispatch; a scheduled run leaves it false so
      # slot idempotency still governs bursts of deliveries.
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
