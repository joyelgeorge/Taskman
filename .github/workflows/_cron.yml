# Shared runner for every Taskman cron.
#
# The crons talk to the database directly and never through the API, so a sleeping
# free-tier web service cannot silently stop the autonomous system.
name: cron

on:
  workflow_call:
    inputs:
      name:
        description: Cron to run
        type: string
        required: true
      timeout-minutes:
        type: number
        default: 10
    secrets:
      DATABASE_URL:
        required: true
      STRIPE_API_KEY:
        required: false

jobs:
  run:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      # `npm install` rather than `npm ci`, so the workflow keeps working whether
      # or not package-lock.json is committed.
      - run: npm install --omit=dev --no-audit --no-fund

      # A cron is the first thing to touch a newly provisioned database, so the
      # schema has to exist before it runs — otherwise the first run after
      # DATABASE_URL is set dies on "relation does not exist" and every cron
      # stays red for a reason that looks nothing like the actual cause.
      # scripts/migrate.js takes an advisory lock and is a no-op once applied, so
      # it is safe to run ahead of every cron and safe when two crons overlap.
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Skip rather than fail when the secret is absent. scripts/migrate.js
          # would exit 1 with "database unavailable", which would mask the cron's
          # own far more precise refusal — the message that actually tells you
          # what to set and why a memory-backed cron is worse than a failed one.
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set — skipping migrations so the cron reports the setup error itself."
            exit 0
          fi
          npm run migrate

      - name: Run ${{ inputs.name }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
          HOSTNAME: github-actions
        run: npm run cron -- ${{ inputs.name }}
