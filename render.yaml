# render.yaml — Render deployment configuration for Taskman & Operator
# https://render.com/docs/blueprint-spec

services:
  # Taskman Monolith & Web App
  - type: web
    name: taskman
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --omit=dev && TASKMAN_ROLE=migration node scripts/preflight.js && TASKMAN_ROLE=migration node scripts/migrate.js
    startCommand: TASKMAN_ROLE=web npm start
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: taskman
          property: port
      - key: TASKMAN_BASE_URL
        sync: false
      - key: TASKMAN_AUTH_MODE
        value: api-key
      - key: TASKMAN_TENANT_MODE
        value: single-tenant
      - key: DATABASE_URL
        sync: false                   # Point to Neon PostgreSQL URL
      - key: TASKMAN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MOLTJOBS_API_KEY
        sync: false

  # Backend API Server
  - type: web
    name: taskman-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node packages/api/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false                   # Point to Neon PostgreSQL URL
      - key: CORS_ORIGIN
        sync: false
      - key: TASKMAN_API_TOKEN
        sync: false
      - key: STRIPE_API_KEY
        sync: false

  # Static Operator & Grok Gate Console (Free on Render)
  - type: web
    name: taskman-operator
    runtime: static
    plan: free
    branch: main
    buildCommand: ""
    staticPublishPath: packages/web/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
