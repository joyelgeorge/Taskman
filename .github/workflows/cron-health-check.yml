# Checks db, services, drones and crons; opens and resolves alerts.
name: cron · health-check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-health-check
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_cron.yml
    with:
      name: health-check
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
