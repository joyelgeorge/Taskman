services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskman
      POSTGRES_USER: taskman
      POSTGRES_PASSWORD: taskman_local
    ports:
      - "5432:5432"
    volumes:
      - taskman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskman -d taskman"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskman_pgdata:
