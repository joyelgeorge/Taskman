# render.yaml — Render deployment configuration for Taskman
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: taskman
    runtime: node
    plan: free                        # upgrade to starter/standard for always-on
    region: oregon                    # us-west-2
    branch: main
    buildCommand: npm ci --omit=dev && TASKMAN_ROLE=migration node scripts/preflight.js && TASKMAN_ROLE=migration node scripts/migrate.js
    startCommand: TASKMAN_ROLE=web npm start
    healthCheckPath: /health/ready
    autoDeploy: true                  # redeploy on every push to main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: taskman
          property: port
      - key: TASKMAN_BASE_URL
        sync: false                   # complete public HTTPS URL
      - key: TASKMAN_AUTH_MODE
        value: api-key
      - key: TASKMAN_TENANT_MODE
        value: single-tenant
      - key: DATABASE_URL
        fromDatabase:
          name: taskman-db
          property: connectionString
      # Set manually in Render dashboard — never commit values:
      - key: TASKMAN_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MOLTJOBS_API_KEY
        sync: false

  # Backend API. Free tier sleeps after inactivity, which is fine by design:
  # crons talk to the database directly and never depend on this being awake.
  - type: web
    name: taskman-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node packages/api/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskman-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: TASKMAN_API_TOKEN
        sync: false
      - key: STRIPE_API_KEY
        sync: false

databases:
  - name: taskman-db
    databaseName: taskman
    user: taskman
    plan: free                        # upgrade to starter for production persistence
    region: oregon
